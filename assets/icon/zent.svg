<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Ícone do app — identidade v3.0 "Céu de Galáxia".
       Marca ASCENSÃO (R10 §3) sobre o quadrado do Bloco 1 · Petróleo & Aço.
       A geometria é a mesma do componente ZentLogo (viewBox 40×40 escalado):
       se um mudar sem o outro, o atalho deixa de ser o mesmo produto.
       Os stroke-width 2.2/1.8 estão em unidades da MARCA (dentro do grupo
       escalado) de propósito: scripts/gen-icon.mjs os engrossa para 2.6/2.2
       nos tamanhos ≤24px, onde o traço fino desaparece. -->
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122226"/>
      <stop offset="1" stop-color="#0A171A"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#86B6C9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A6C9D7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#86B6C9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#86B6C9" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#86B6C9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#chip)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#halo)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#2A4148" stroke-width="2"/>
  <rect x="48" y="9" width="160" height="2.5" rx="1.25" fill="url(#topline)"/>
  <g transform="translate(17.6 36.8) scale(4.8)" fill="none" stroke="#86B6C9"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 11h17L9 27h12" stroke-width="2.2"/>
    <path d="M21 27l5-5 4 3 6-9" stroke-width="1.8"/>
  </g>
</svg>
